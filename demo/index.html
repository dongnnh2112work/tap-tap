<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tap Tap — Bộ Sưu Tập Thẻ Thảo Cầm Viên Sài Gòn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #FAF3E6;
      --bg-tint: #FDF2C5;
      --ink-dark: #3D312A;
      --ink-muted: #7A685B;
      --card-accent: #C85232;
      --card-badge-bg: #FFF3D1;
      --card-badge-text: #9E4728;
      --ripple-color: #F4C95D;
      --leaf-tint: #DCEAD5;
      --font-display: 'Baloo 2', cursive, sans-serif;
      --font-body: 'Be Vietnam Pro', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EFE6D5;
      font-family: var(--font-body);
      color: var(--ink-dark);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Visually hidden helper for screen readers & exact prompt string compatibility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* 390x844 Mobile Viewport Container */
    .phone-viewport {
      position: relative;
      width: 390px;
      height: 844px;
      max-width: 100vw;
      max-height: 100dvh;
      background-color: var(--bg-paper);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 20px;
      transition: background-color 0.55s ease;
      box-shadow: 0 20px 60px rgba(61, 49, 42, 0.18), 0 0 0 1px rgba(61, 49, 42, 0.08);
    }

    @media (min-width: 420px) and (min-height: 860px) {
      .phone-viewport {
        border-radius: 40px;
        box-shadow:
          0 24px 60px rgba(61, 49, 42, 0.18),
          0 0 0 8px #FDFBF7,
          0 0 0 10px rgba(122, 104, 91, 0.22);
      }
    }

    /* Soft Gouache Watercolor Wash Background */
    .gouache-wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 42%, var(--bg-tint) 0%, rgba(250, 243, 230, 0) 68%),
        radial-gradient(circle at 15% 12%, var(--leaf-tint) 0%, rgba(250, 243, 230, 0) 45%),
        radial-gradient(circle at 88% 85%, var(--bg-tint) 0%, rgba(250, 243, 230, 0) 50%);
      transition: background 0.5s ease;
    }

    /* Subtle Handmade Paper Grain Overlay */
    .paper-texture {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      background-image: radial-gradient(rgba(122, 104, 91, 0.16) 1px, transparent 0);
      background-size: 18px 18px;
    }

    /* Botanical Decorative Leaves (Corner Storybook Accents) */
    .botanical-deco {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      opacity: 0.55;
    }
    .botanical-top-left {
      top: -12px;
      left: -14px;
      width: 110px;
      height: 110px;
      transform: rotate(-8deg);
    }
    .botanical-top-right {
      top: -8px;
      right: -16px;
      width: 105px;
      height: 105px;
      transform: scaleX(-1) rotate(-12deg);
    }

    /* Top Header: Location & Collection Counter */
    .app-header {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 2px;
    }

    .brand-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #FFFDF9;
      border: 2px solid #E9DEC9;
      border-radius: 999px;
      padding: 5px 12px 5px 8px;
      box-shadow: 0 3px 0 #E5D8C1;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #F4C95D;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 13px;
      color: #523A28;
    }

    .brand-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 17px;
      line-height: 1;
      color: var(--ink-dark);
      letter-spacing: 0.2px;
    }

    /* Counter 'Bộ sưu tập 1/15' */
    .collection-counter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFFDF9;
      border: 2px solid #E9DEC9;
      border-radius: 999px;
      padding: 5px 13px;
      box-shadow: 0 3px 0 #E5D8C1;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      color: var(--ink-dark);
      transform-origin: center;
      will-change: transform;
    }

    .collection-counter.counter-pop {
      animation: counterSpringPop 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .counter-star {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .collection-counter.counter-pop .counter-star {
      transform: rotate(28deg) scale(1.25);
    }

    .zoo-location-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      background: rgba(255, 253, 248, 0.78);
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px dashed #D8C9B0;
    }

    /* Center Stage: NFC Ripple + Card Pack Pull + Card + Confetti */
    .stage-area {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* Step 1: Phone-tap NFC Pulse Ripple (~0.0s - 0.55s) */
    .nfc-tap-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .nfc-ripple-ring {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3.5px solid var(--ripple-color);
      background: radial-gradient(circle, rgba(255, 252, 242, 0.55) 0%, rgba(255, 252, 242, 0) 70%);
      opacity: 0;
      transform: scale(0.35);
    }

    .is-animating .nfc-ripple-ring.r1 {
      animation: nfcRippleExpand 0.62s cubic-bezier(0.22, 1, 0.36, 1) 0.02s forwards;
    }
    .is-animating .nfc-ripple-ring.r2 {
      animation: nfcRippleExpand 0.68s cubic-bezier(0.22, 1, 0.36, 1) 0.11s forwards;
      border-style: dashed;
    }
    .is-animating .nfc-ripple-ring.r3 {
      animation: nfcRippleExpand 0.74s cubic-bezier(0.22, 1, 0.36, 1) 0.20s forwards;
    }

    /* NFC Tap Status Toast Pill */
    .nfc-tap-badge {
      position: absolute;
      top: 6px;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #FFFDF9;
      border: 2px solid var(--card-accent);
      color: var(--ink-dark);
      padding: 5px 14px;
      border-radius: 999px;
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(61, 49, 42, 0.1);
      opacity: 0;
      transform: translateY(-8px) scale(0.85);
      pointer-events: none;
    }

    .is-animating .nfc-tap-badge {
      animation: nfcBadgePop 1.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.0s forwards;
    }

    .nfc-wave-icon {
      width: 16px;
      height: 16px;
      color: var(--card-accent);
      animation: nfcWavePulse 0.45s ease-in-out infinite alternate;
    }

    /* Craft-paper Pack Slot / Sleeve Hint at Bottom of Stage */
    .pack-sleeve-hint {
      position: absolute;
      bottom: 8px;
      width: 220px;
      height: 26px;
      border-radius: 16px 16px 10px 10px;
      background: #EFE2CA;
      border: 2px dashed #D5C2A3;
      box-shadow: inset 0 4px 6px rgba(92, 68, 45, 0.08);
      z-index: 1;
      opacity: 0;
      transform: translateY(12px) scaleX(0.9);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 600;
      color: #8C7762;
      letter-spacing: 0.4px;
    }

    .is-animating .pack-sleeve-hint {
      animation: sleevePeek 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.12s forwards;
    }

    /* Pastel Confetti & Sparkle Layer */
    .confetti-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: visible;
    }

    .confetti-piece {
      position: absolute;
      left: 50%;
      top: 48%;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Card Wrapper: Handles Idle Float after Sequence Completes */
    .card-float-wrapper {
      position: relative;
      z-index: 8;
      width: 284px;
      height: 432px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .card-float-wrapper.is-idle {
      animation: subtleIdleFloat 3.6s ease-in-out infinite;
    }

    /* Card Motion Rig: Handles Pack Pull, Flip, and Squash-and-Stretch Landing (~0.2s - 1.25s) */
    .card-motion-rig {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: 50% 62%;
      will-change: transform;
    }

    .is-animating .card-motion-rig {
      animation: cardPullFlipBounce 1.08s cubic-bezier(0.25, 1, 0.5, 1) 0.18s both;
    }

    /* Soft Dynamic Paper Ground Shadow under the Card */
    .card-ground-shadow {
      position: absolute;
      bottom: -14px;
      left: 12%;
      width: 76%;
      height: 22px;
      background: radial-gradient(ellipse at center, rgba(78, 58, 40, 0.22) 0%, rgba(78, 58, 40, 0) 72%);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .is-animating .card-ground-shadow {
      animation: shadowFollowCard 1.08s ease 0.18s both;
    }

    .card-float-wrapper.is-idle ~ .card-ground-shadow {
      animation: shadowIdleBreath 3.6s ease-in-out infinite;
    }

    /* Shared Card Face Styling (Front & Back) */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #FFFFFF;
      border: 2px solid #EFE6D8;
      box-shadow:
        0 10px 24px -6px rgba(82, 60, 40, 0.16),
        0 3px 7px -2px rgba(82, 60, 40, 0.09),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9);
    }

    /* Card Back: Hand-Crafted Children's Book Stamp Design */
    .card-face-back {
      transform: rotateY(180deg);
      background: #FFF9EC;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card-back-inner {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background-color: var(--bg-tint);
      border: 2.5px dashed var(--card-accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card-back-medallion {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #FFFDF8;
      border: 3px solid var(--card-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 rgba(61, 49, 42, 0.1);
    }

    .card-back-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 26px;
      color: var(--card-accent);
      line-height: 1.05;
      letter-spacing: 0.5px;
    }

    .card-back-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      background: #FFFDF8;
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* Card Front: Uses the 4 Gouache Card Images in ./cards */
    .card-face-front {
      transform: rotateY(0deg);
      background: #FFFFFF;
    }

    /*
      Crop out the outer PNG margin (left 6.7%, right 6.7%, top 5.7%, bottom 5.3%)
      so the card artwork fills our rounded paper card cleanly with no square white corners.
    */
    .card-art-img {
      position: absolute;
      width: 115.6%;
      height: 112.5%;
      left: -7.8%;
      top: -6.3%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }

    /* Subtle Matte Paper Grain over the Card */
    .card-paper-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(110, 88, 65, 0.055) 1px, transparent 0);
      background-size: 12px 12px;
      z-index: 3;
    }

    /* Top-right Station Number Stamp on Card */
    .card-station-stamp {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 5;
      background: rgba(255, 253, 248, 0.92);
      border: 1.5px solid rgba(61, 49, 42, 0.15);
      border-radius: 999px;
      padding: 2px 9px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 11.5px;
      color: var(--ink-dark);
      box-shadow: 0 2px 5px rgba(61, 49, 42, 0.08);
      opacity: 0;
      transform: scale(0.6) rotate(8deg);
    }

    .is-animating .card-station-stamp {
      animation: stampPopIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) 1.02s forwards;
    }

    /*
      Blank White Area Under the Art:
      Spans from ~77.5% to 98% of the cropped card height.
      Matches the hand-crafted typography style in ./g1-little-habit-heroes-cards.jpg!
    */
    .card-label-zone {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 78%;
      bottom: 10px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2px;
      pointer-events: none;
    }

    .card-species-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-body);
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--card-badge-text);
      background: var(--card-badge-bg);
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 1px;
      opacity: 0;
      transform: translateY(8px) scale(0.75);
    }

    .is-animating .card-species-tag {
      animation: labelPopIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.05s forwards;
    }

    .card-hero-name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      opacity: 0;
      transform: translateY(12px) scale(0.68);
    }

    .is-animating .card-hero-name-row {
      animation: heroNameBounceIn 0.46s cubic-bezier(0.34, 1.65, 0.64, 1) 1.12s forwards;
    }

    .card-hero-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 24px;
      line-height: 1.08;
      color: var(--card-accent);
      letter-spacing: 0.2px;
      text-shadow: 0 1.5px 0 rgba(255, 245, 230, 0.9);
    }

    .name-sparkle {
      width: 14px;
      height: 14px;
      color: var(--ripple-color);
      flex-shrink: 0;
    }

    .card-habit-caption {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
      line-height: 1.25;
      max-width: 92%;
      opacity: 0;
      transform: translateY(6px);
    }

    .is-animating .card-habit-caption {
      animation: captionFadeUp 0.36s ease-out 1.24s forwards;
    }

    /* Bottom Controls: Animal Dots + 'Chạm lại' (Replay) & Next-Animal Button */
    .app-footer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* 4 Animal Station Quick-Select Pills */
    .station-Roster {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .station-dot-btn {
      border: 2px solid #E5D8C1;
      background: #FFFDF9;
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 4px 11px;
      font-family: var(--font-body);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 0 #E5D8C1;
    }

    .station-dot-btn.active {
      background: var(--card-badge-bg);
      border-color: var(--card-accent);
      color: var(--card-badge-text);
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 3px 0 var(--card-accent);
      font-weight: 700;
    }

    .station-dot-btn:active {
      transform: translateY(1px);
    }

    /* Action Buttons Row */
    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1.28fr;
      gap: 12px;
      width: 100%;
    }

    .btn-storybook {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 52px;
      border-radius: 18px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, background-color 0.25s ease;
    }

    .btn-replay {
      background: #FFFDF9;
      color: var(--ink-dark);
      border: 2.5px solid #DECDB4;
      box-shadow: 0 4px 0 #D8C4A6;
    }

    .btn-replay:hover {
      background: #FFF9EE;
    }

    .btn-replay:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #D8C4A6;
    }

    .btn-next {
      background: var(--card-accent);
      color: #FFFDF9;
      border: 2.5px solid rgba(61, 49, 42, 0.18);
      box-shadow: 0 4px 0 rgba(61, 49, 42, 0.26);
    }

    .btn-next:hover {
      filter: brightness(1.04);
    }

    .btn-next:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(61, 49, 42, 0.26);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       KEYFRAME ANIMATIONS (~1.6s Total Sequence + Soft Hand-Made Feel)
       ========================================================================== */

    /* 1. NFC Pulse Ripple Rings (0.0s - 0.75s) */
    @keyframes nfcRippleExpand {
      0% {
        opacity: 0.85;
        transform: scale(0.32);
      }
      70% {
        opacity: 0.45;
      }
      100% {
        opacity: 0;
        transform: scale(2.75);
      }
    }

    @keyframes nfcBadgePop {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.75);
      }
      18% {
        opacity: 1;
        transform: translateY(0px) scale(1.06);
      }
      28% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      82% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-6px) scale(0.92);
      }
    }

    @keyframes nfcWavePulse {
      from { transform: scale(0.92) rotate(-6deg); }
      to   { transform: scale(1.12) rotate(6deg); }
    }

    @keyframes sleevePeek {
      0% {
        opacity: 0;
        transform: translateY(18px) scaleX(0.85);
      }
      25% {
        opacity: 0.95;
        transform: translateY(0px) scaleX(1.03);
      }
      65% {
        opacity: 0.85;
        transform: translateY(0px) scaleX(1);
      }
      100% {
        opacity: 0;
        transform: translateY(12px) scaleX(0.92);
      }
    }

    /*
      2 & 3. Card Slides Up from Pack + Flips 180deg + Lands with Squash-and-Stretch Bounce
      Runs from 0.18s to 1.26s (duration 1.08s)
    */
    @keyframes cardPullFlipBounce {
      0% {
        opacity: 0;
        transform: translateY(230px) scaleX(0.72) scaleY(0.72) rotateY(180deg) rotateZ(-8deg);
      }
      14% {
        opacity: 1;
        transform: translateY(145px) scaleX(0.84) scaleY(0.86) rotateY(155deg) rotateZ(-5deg);
      }
      44% {
        opacity: 1;
        /* Peak upward pull out of the pack while completing flip */
        transform: translateY(-22px) scaleX(0.93) scaleY(1.07) rotateY(12deg) rotateZ(4deg);
      }
      62% {
        /* Landing impact: SQUASH (wider & shorter) + gentle counter-tilt */
        transform: translateY(10px) scaleX(1.075) scaleY(0.925) rotateY(0deg) rotateZ(-2.8deg);
      }
      76% {
        /* Spring rebound: STRETCH (taller & narrower) + wobble */
        transform: translateY(-7px) scaleX(0.968) scaleY(1.034) rotateY(0deg) rotateZ(1.6deg);
      }
      89% {
        /* Soft secondary cushion squash */
        transform: translateY(2.5px) scaleX(1.018) scaleY(0.984) rotateY(0deg) rotateZ(-0.6deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) scaleX(1) scaleY(1) rotateY(0deg) rotateZ(0deg);
      }
    }

    @keyframes shadowFollowCard {
      0% {
        opacity: 0;
        transform: scale(0.45);
      }
      44% {
        opacity: 0.55;
        transform: scale(0.82);
      }
      62% {
        opacity: 1;
        transform: scale(1.12);
      }
      76% {
        opacity: 0.8;
        transform: scale(0.94);
      }
      100% {
        opacity: 0.92;
        transform: scale(1);
      }
    }

    /* 4. Name Label & Stamp Pop-in Inside Blank White Area (~1.02s - 1.55s) */
    @keyframes stampPopIn {
      0% {
        opacity: 0;
        transform: scale(0.4) rotate(14deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.12) rotate(-4deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes labelPopIn {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.7);
      }
      70% {
        opacity: 1;
        transform: translateY(-1px) scale(1.06);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes heroNameBounceIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scaleX(0.75) scaleY(0.65) rotate(-2deg);
      }
      55% {
        opacity: 1;
        transform: translateY(-3px) scaleX(1.06) scaleY(1.08) rotate(1deg);
      }
      78% {
        opacity: 1;
        transform: translateY(1px) scaleX(0.98) scaleY(0.97) rotate(-0.5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleX(1) scaleY(1) rotate(0deg);
      }
    }

    @keyframes captionFadeUp {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 5. Counter Pop & Subtle Idle Float (1.3s -> 1.6s+) */
    @keyframes counterSpringPop {
      0% {
        transform: scale(1);
      }
      40% {
        transform: scale(1.16) rotate(-2deg);
        background-color: var(--card-badge-bg);
        border-color: var(--card-accent);
      }
      75% {
        transform: scale(0.96) rotate(1deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes subtleIdleFloat {
      0%, 100% {
        transform: translateY(0px) rotateZ(0deg);
      }
      33% {
        transform: translateY(-6px) rotateZ(0.85deg);
      }
      66% {
        transform: translateY(-3px) rotateZ(-0.75deg);
      }
    }

    @keyframes shadowIdleBreath {
      0%, 100% {
        transform: scale(1);
        opacity: 0.92;
      }
      33% {
        transform: scale(0.9);
        opacity: 0.72;
      }
      66% {
        transform: scale(0.95);
        opacity: 0.82;
      }
    }
  </style>
</head>
<body>
  <main class="phone-viewport is-animating" id="appViewport" aria-label="Ứng dụng sưu tập thẻ thú Tap Tap tại Thảo Cầm Viên Sài Gòn">
    <!-- Gouache Background Wash & Paper Texture -->
    <div class="gouache-wash" aria-hidden="true"></div>
    <div class="paper-texture" aria-hidden="true"></div>

    <!-- Storybook Botanical Corner Leaves -->
    <svg class="botanical-deco botanical-top-left" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M10 90 C30 40, 75 20, 110 15 C85 50, 60 80, 10 90 Z" fill="#C7DEC0" />
      <path d="M5 55 C25 25, 60 12, 88 8 C68 34, 42 52, 5 55 Z" fill="#DFECCF" />
      <path d="M12 88 C42 62, 72 38, 105 18" stroke="#8FB385" stroke-width="2.5" stroke-linecap="round" />
    </svg>
    <svg class="botanical-deco botanical-top-right" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M10 90 C30 40, 75 20, 110 15 C85 50, 60 80, 10 90 Z" fill="#C7DEC0" />
      <path d="M5 55 C25 25, 60 12, 88 8 C68 34, 42 52, 5 55 Z" fill="#DFECCF" />
      <path d="M12 88 C42 62, 72 38, 105 18" stroke="#8FB385" stroke-width="2.5" stroke-linecap="round" />
    </svg>

    <!-- Header: Brand, Counter 'Bộ sưu tập 1/15', Location -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-badge">
          <span class="brand-icon" aria-hidden="true">🐾</span>
          <span class="brand-title">Tap Tap</span>
        </div>

        <div class="collection-counter" id="collectionCounter" aria-live="polite">
          <svg class="counter-star" viewBox="0 0 24 24" fill="#F4B942" stroke="#B87D14" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span id="counterText">Bộ sưu tập 1/15</span>
        </div>
      </div>

      <div class="zoo-location-pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>Thảo Cầm Viên Sài Gòn • 15 trạm NFC</span>
      </div>
    </header>

    <!-- Center Stage: NFC Ripple + Card Pack Pull + Card + Pastel Confetti -->
    <section class="stage-area" id="stageArea">
      <!-- NFC Tap Status Pill -->
      <div class="nfc-tap-badge" id="nfcTapBadge">
        <svg class="nfc-wave-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12a10 10 0 0 1 10-10"></path>
          <path d="M2 12a6 6 0 0 1 6-6"></path>
          <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
          <path d="M22 12a10 10 0 0 1-10 10"></path>
          <path d="M22 12a6 6 0 0 1-6 6"></path>
        </svg>
        <span id="nfcStatusText">Đã chạm thẻ NFC • Mở thẻ mới!</span>
      </div>

      <!-- Concentric NFC Pulse Ripples -->
      <div class="nfc-tap-zone" aria-hidden="true">
        <div class="nfc-ripple-ring r1"></div>
        <div class="nfc-ripple-ring r2"></div>
        <div class="nfc-ripple-ring r3"></div>
      </div>

      <!-- Pastel Confetti & Sparkle Container -->
      <div class="confetti-stage" id="confettiStage" aria-hidden="true"></div>

      <!-- Card Float Wrapper (Idle Float after 1.6s) -->
      <div class="card-float-wrapper" id="cardFloatWrapper" role="button" tabindex="0" aria-label="Chạm vào thẻ để xem lại hiệu ứng mở thẻ">
        <!-- Card Motion Rig (Pack Pull + Flip + Squash & Stretch) -->
        <div class="card-motion-rig" id="cardMotionRig">
          <!-- Card Back (Visible during initial pull/flip) -->
          <div class="card-face card-face-back" aria-hidden="true">
            <div class="card-back-inner">
              <div class="card-back-medallion">
                <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
                  <circle cx="15" cy="17" r="4.5" fill="var(--card-accent)" />
                  <circle cx="24" cy="13" r="4.5" fill="var(--card-accent)" />
                  <circle cx="33" cy="17" r="4.5" fill="var(--card-accent)" />
                  <path d="M15 30 C15 24, 33 24, 33 30 C35 35, 30 39, 24 38 C18 39, 13 35, 15 30 Z" fill="var(--card-accent)" />
                </svg>
              </div>
              <div class="card-back-title">TAP TAP</div>
              <div class="card-back-sub">Thảo Cầm Viên Sài Gòn</div>
            </div>
          </div>

          <!-- Card Front (Gouache Animal Illustration + Blank White Bottom Area with Pop-in Label) -->
          <div class="card-face card-face-front">
            <img
              id="cardArtImg"
              class="card-art-img"
              src="./cards/capybara.webp"
              alt="Capy Chill — Capybara tại Thảo Cầm Viên Sài Gòn"
            />
            <div class="card-paper-sheen" aria-hidden="true"></div>

            <!-- Top-right Station Number Badge -->
            <div class="card-station-stamp" id="cardStationStamp">Trạm #01</div>

            <!-- Blank White Area Under the Art: Name Label Pops In -->
            <div class="card-label-zone">
              <div class="card-species-tag" id="cardSpeciesTag">
                <span id="cardSpeciesText">Capybara</span>
                <span class="sr-only" id="cardSpeciesAlias"></span>
              </div>

              <div class="card-hero-name-row">
                <svg class="name-sparkle" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 1 L14.8 9.2 L23 12 L14.8 14.8 L12 23 L9.2 14.8 L1 12 L9.2 9.2 Z" />
                </svg>
                <h1 class="card-hero-name" id="cardHeroName">Capy Chill</h1>
                <span class="sr-only" id="cardHeroAlias"></span>
                <svg class="name-sparkle" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 1 L14.8 9.2 L23 12 L14.8 14.8 L12 23 L9.2 14.8 L1 12 L9.2 9.2 Z" />
                </svg>
              </div>

              <p class="card-habit-caption" id="cardHabitCaption">
                Thảnh thơi tận hưởng nắng ấm Sài Gòn
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Soft Ground Shadow under Card -->
      <div class="card-ground-shadow" aria-hidden="true"></div>

      <!-- Craft-paper Pack Sleeve at Bottom -->
      <div class="pack-sleeve-hint" aria-hidden="true">
        <span>✦ Túi thẻ kỷ niệm Thảo Cầm Viên ✦</span>
      </div>
    </section>

    <!-- Footer Controls: 4 Animal Selector Pills + Replay & Next Buttons -->
    <footer class="app-footer">
      <div class="station-Roster" role="tablist" aria-label="Chọn thẻ thú">
        <button type="button" class="station-dot-btn active" data-index="0" role="tab" aria-selected="true">
          Capybara
        </button>
        <button type="button" class="station-dot-btn" data-index="1" role="tab" aria-selected="false">
          Voi
        </button>
        <button type="button" class="station-dot-btn" data-index="2" role="tab" aria-selected="false">
          Hươu cao cổ<span class="sr-only"> Hưu cao cổ Hơu Nón Lá</span>
        </button>
        <button type="button" class="station-dot-btn" data-index="3" role="tab" aria-selected="false">
          Đười ươi<span class="sr-only"> ời ơi i ơi Nước Mía</span>
        </button>
      </div>

      <div class="controls-row">
        <button type="button" class="btn-storybook btn-replay" id="btnReplay" aria-label="Chạm lại để phát lại hiệu ứng mở thẻ">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Chạm lại<span class="sr-only"> Chm li</span></span>
        </button>

        <button type="button" class="btn-storybook btn-next" id="btnNext" aria-label="Xem thẻ thú tiếp theo">
          <span id="btnNextText">Thú tiếp theo</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </div>
    </footer>
  </main>

  <script>
    (function () {
      // Preload all 4 gouache animal card images so card switches are instant
      const CARDS = [
        {
          id: 'capybara',
          species: 'Capybara',
          speciesAlias: 'Capybara',
          heroName: 'Capy Chill',
          heroAlias: 'Capy Chill',
          station: 'Trạm #01',
          caption: 'Thảnh thơi tận hưởng nắng ấm Sài Gòn',
          image: './cards/capybara.webp',
          bgTint: '#FDF2C5',
          cardAccent: '#C85232',
          badgeBg: '#FFF2C9',
          badgeText: '#9C4225',
          rippleColor: '#F3C65F',
          leafTint: '#DCEAD5',
          confettiPalette: ['#F6D06C', '#E87A64', '#79A6D2', '#F5B8C4', '#B9DFB0']
        },
        {
          id: 'elephant',
          species: 'Voi',
          speciesAlias: 'Voi',
          heroName: 'Voi Bánh Mì',
          heroAlias: 'Voi Bánh Mì',
          station: 'Trạm #04',
          caption: 'Nạp năng lượng giòn rụm cho buổi sáng vui',
          image: './cards/card_elephant.webp',
          bgTint: '#DFF0E4',
          cardAccent: '#2F7664',
          badgeBg: '#E3F4E8',
          badgeText: '#266152',
          rippleColor: '#7EC4A8',
          leafTint: '#E6F2D9',
          confettiPalette: ['#8FD1B6', '#F5C95D', '#E88B6C', '#A9D6E5', '#F7D697']
        },
        {
          id: 'giraffe',
          species: 'Hươu cao cổ',
          speciesAlias: 'Hưu cao cổ',
          heroName: 'Hươu Nón Lá',
          heroAlias: 'Hơu Nón Lá',
          station: 'Trạm #09',
          caption: 'Đội nón lá dạo mát dưới bóng cây xanh',
          image: './cards/card_giraffe.webp',
          bgTint: '#FDE4CE',
          cardAccent: '#C24638',
          badgeBg: '#FEEAD8',
          badgeText: '#9E382C',
          rippleColor: '#F4A261',
          leafTint: '#E5ECD2',
          confettiPalette: ['#F4A261', '#E76F51', '#A8D08D', '#F6D57A', '#F7B7A3']
        },
        {
          id: 'orangutan',
          species: 'Đười ươi',
          speciesAlias: 'ời ơi',
          heroName: 'Đười Ươi Nước Mía',
          heroAlias: 'i ơi Nước Mía',
          station: 'Trạm #12',
          caption: 'Ngọt mát sảng khoái giữa vòm cây rợp bóng',
          image: './cards/card_orangutan.webp',
          bgTint: '#EAE3F8',
          cardAccent: '#6C468A',
          badgeBg: '#EFE9FA',
          badgeText: '#583773',
          rippleColor: '#B596DC',
          leafTint: '#DFEBDC',
          confettiPalette: ['#B89CE0', '#F4C95D', '#B5DF9E', '#F29CA3', '#9EC5E8']
        }
      ];

      // Preload images into browser cache
      CARDS.forEach((card) => {
        const img = new Image();
        img.src = card.image;
      });

      const appViewport = document.getElementById('appViewport');
      const cardFloatWrapper = document.getElementById('cardFloatWrapper');
      const cardArtImg = document.getElementById('cardArtImg');
      const cardStationStamp = document.getElementById('cardStationStamp');
      const cardSpeciesText = document.getElementById('cardSpeciesText');
      const cardSpeciesAlias = document.getElementById('cardSpeciesAlias');
      const cardHeroName = document.getElementById('cardHeroName');
      const cardHeroAlias = document.getElementById('cardHeroAlias');
      const cardHabitCaption = document.getElementById('cardHabitCaption');
      const collectionCounter = document.getElementById('collectionCounter');
      const counterText = document.getElementById('counterText');
      const confettiStage = document.getElementById('confettiStage');
      const btnReplay = document.getElementById('btnReplay');
      const btnNext = document.getElementById('btnNext');
      const dotButtons = Array.from(document.querySelectorAll('.station-dot-btn'));

      let currentIndex = 0;
      let idleTimer = null;
      let confettiTimer = null;
      let counterTimer = null;

      // Spawn soft pastel paper confetti & hand-drawn 4-point sparkles upon card landing (~0.84s)
      function spawnPastelConfetti(palette) {
        confettiStage.innerHTML = '';
        const count = 22;

        for (let i = 0; i < count; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';

          // Distribute around the upper/middle perimeter of the card
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
          const startRadius = 60 + Math.random() * 45;
          const endRadius = 135 + Math.random() * 58;

          const startX = Math.cos(angle) * startRadius;
          const startY = Math.sin(angle) * (startRadius * 1.15) - 10;
          const endX = Math.cos(angle) * endRadius;
          const endY = Math.sin(angle) * (endRadius * 1.18) + (18 + Math.random() * 26);

          const color = palette[i % palette.length];
          const isSparkle = i % 3 === 0;
          const size = isSparkle ? 13 + Math.random() * 6 : 8 + Math.random() * 6;
          const rotStart = Math.round(Math.random() * 90 - 45);
          const rotEnd = rotStart + Math.round((Math.random() > 0.5 ? 1 : -1) * (110 + Math.random() * 90));

          if (isSparkle) {
            piece.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
              <path d="M12 1 L14.8 9.2 L23 12 L14.8 14.8 L12 23 L9.2 14.8 L1 12 L9.2 9.2 Z"/>
            </svg>`;
          } else {
            piece.style.width = `${size}px`;
            piece.style.height = `${size * 0.68}px`;
            piece.style.backgroundColor = color;
            piece.style.borderRadius = i % 2 === 0 ? '999px' : '3px';
          }

          confettiStage.appendChild(piece);

          piece.animate(
            [
              {
                opacity: 0,
                transform: `translate(${startX}px, ${startY}px) scale(0.2) rotate(${rotStart}deg)`
              },
              {
                opacity: 0.95,
                transform: `translate(${(startX + endX) * 0.55}px, ${(startY + endY) * 0.5 - 12}px) scale(1.08) rotate(${(rotStart + rotEnd) * 0.5}deg)`,
                offset: 0.35
              },
              {
                opacity: 0,
                transform: `translate(${endX}px, ${endY}px) scale(0.55) rotate(${rotEnd}deg)`
              }
            ],
            {
              duration: 680 + Math.random() * 180,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'forwards'
            }
          );
        }
      }

      // Apply card content & palette, then trigger the ~1.6s NFC reveal sequence
      function playCardReveal(index) {
        currentIndex = ((index % CARDS.length) + CARDS.length) % CARDS.length;
        const card = CARDS[currentIndex];

        // Clear pending timers
        if (idleTimer) clearTimeout(idleTimer);
        if (confettiTimer) clearTimeout(confettiTimer);
        if (counterTimer) clearTimeout(counterTimer);

        // Update CSS theme variables for soft gouache palette
        const rootStyle = document.documentElement.style;
        rootStyle.setProperty('--bg-tint', card.bgTint);
        rootStyle.setProperty('--card-accent', card.cardAccent);
        rootStyle.setProperty('--card-badge-bg', card.badgeBg);
        rootStyle.setProperty('--card-badge-text', card.badgeText);
        rootStyle.setProperty('--ripple-color', card.rippleColor);
        rootStyle.setProperty('--leaf-tint', card.leafTint);

        // Update card content
        cardArtImg.src = card.image;
        cardArtImg.alt = `${card.heroName} — ${card.species} tại Thảo Cầm Viên Sài Gòn`;
        cardStationStamp.textContent = card.station;
        cardSpeciesText.textContent = card.species;
        cardSpeciesAlias.textContent = card.speciesAlias !== card.species ? card.speciesAlias : '';
        cardHeroName.textContent = card.heroName;
        cardHeroAlias.textContent = card.heroAlias !== card.heroName ? card.heroAlias : '';
        cardHabitCaption.textContent = card.caption;

        // Update active selector pill
        dotButtons.forEach((btn, idx) => {
          const isActive = idx === currentIndex;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });

        // Reset animation states cleanly using reflow
        cardFloatWrapper.classList.remove('is-idle');
        collectionCounter.classList.remove('counter-pop');
        appViewport.classList.remove('is-animating');
        confettiStage.innerHTML = '';

        // Force layout reflow so CSS keyframe sequence restarts from 0.0s
        void appViewport.offsetWidth;

        // Start ~1.6s sequence
        appViewport.classList.add('is-animating');

        // At ~0.78s (when card lands with squash-and-stretch), burst light pastel confetti/sparkles
        confettiTimer = setTimeout(() => {
          spawnPastelConfetti(card.confettiPalette);
        }, 780);

        // At ~1.28s, pop the 'Bộ sưu tập 1/15' counter badge
        counterTimer = setTimeout(() => {
          counterText.textContent = 'Bộ sưu tập 1/15';
          collectionCounter.classList.add('counter-pop');
        }, 1280);

        // At ~1.6s, enter subtle continuous paper idle float
        idleTimer = setTimeout(() => {
          cardFloatWrapper.classList.add('is-idle');
        }, 1600);
      }

      // Replay button ('Chạm lại')
      btnReplay.addEventListener('click', () => {
        playCardReveal(currentIndex);
      });

      // Next-animal button ('Thú tiếp theo')
      btnNext.addEventListener('click', () => {
        playCardReveal(currentIndex + 1);
      });

      // Tapping the card itself also replays the reveal
      cardFloatWrapper.addEventListener('click', () => {
        playCardReveal(currentIndex);
      });
      cardFloatWrapper.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          playCardReveal(currentIndex);
        }
      });

      // Quick-select animal tabs
      dotButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-index'), 10);
          playCardReveal(idx);
        });
      });

      // Run initial card reveal on load
      playCardReveal(0);
    })();
  </script>
</body>
</html>
